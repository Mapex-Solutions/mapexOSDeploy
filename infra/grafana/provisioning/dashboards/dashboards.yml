# =============================================================================
# Grafana Dashboard Provisioning
# =============================================================================
#
# Auto-loads dashboards from /var/lib/grafana/dashboards on startup.
# Add JSON dashboard files to ./grafana/dashboards/ directory.
#
# =============================================================================

apiVersion: 1

providers:
  - name: "MapexOS"
    orgId: 1
    folder: "MapexOS"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
