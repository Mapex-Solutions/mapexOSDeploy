# NATS Core Configuration
# Central message broker with JetStream

server_name: nats-core

# Connection ports
port: 4222
http_port: 8222

# JetStream Configuration (server-level storage limits).
# Per-account JetStream usage is enabled inside the APP account below.
jetstream {
    enabled: true
    store_dir: "/data/jetstream"
    max_mem_store: 1Gb
    max_file_store: 10Gb
    sync_interval: "10s"
}

# Accounts:
#   SYS — system account; receives client_connect/client_disconnect advisories
#         and exports DISCONNECT to APP so the presence consumer can read it
#         from a JetStream stream hosted in APP.
#   APP — platform account; hosts the MAPEXOS-* JetStream streams and the
#         service user used by all internal MS for normal bus traffic
#         (heartbeat, presence, fanout, dlq, etc).
accounts {
    SYS {
        users: [{ user: "sys_user", password: "sys_pass" }]
        exports: [
            { stream: "$SYS.ACCOUNT.*.DISCONNECT", accounts: ["APP"] }
            { stream: "$SYS.ACCOUNT.*.CONNECT", accounts: ["APP"] }
        ]
    }
    APP {
        jetstream: enabled
        users: [
            {
                user: "service"
                password: "service_secret"
                permissions: {
                    publish:   { allow: [">"] }
                    subscribe: { allow: [">"] }
                }
            }
        ]
        imports: [
            { stream: { account: "SYS", subject: "$SYS.ACCOUNT.*.DISCONNECT" } }
            { stream: { account: "SYS", subject: "$SYS.ACCOUNT.*.CONNECT" } }
        ]
    }
}
system_account: SYS

# The 'service' user remains and is shared
# by all internal MS for normal bus traffic (heartbeat, presence, fanout,
# dlq, etc).

# Logging
debug: false
trace: false
logtime: true
