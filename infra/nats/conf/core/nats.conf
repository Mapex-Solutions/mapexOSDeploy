# NATS Core Configuration
# Central message broker with JetStream

server_name: nats-core

# Connection ports
port: 4222
http_port: 8222

# JetStream Configuration (server-level storage limits).
# Per-account JetStream usage is enabled inside the APP account below.
jetstream {
    enabled: true
    store_dir: "/data/jetstream"
    max_mem_store: 1Gb
    max_file_store: 10Gb
    sync_interval: "10s"
}

# Accounts:
#   SYS — system account required by NATS for server administration.
#   APP — platform account; hosts the MAPEXOS-* JetStream streams and the
#         'service' user shared by every internal microservice for normal
#         bus traffic (heartbeat, presence, fanout, dlq, etc).
#
# MQTT presence does NOT flow through NATS' native $SYS.ACCOUNT.*.CONNECT /
# DISCONNECT advisories anymore — the mapexMQTTBroker Mosquitto plugin
# publishes connect/disconnect events directly on the APP subject
# `${env}.mapexos.presence.advisory`, which the assets healthmonitor
# consumes from the MAPEXOS-EDGE-PRESENCE JetStream stream.
accounts {
    SYS {
        users: [{ user: "sys_user", password: "sys_pass" }]
    }
    APP {
        jetstream: enabled
        users: [
            {
                user: "service"
                password: "service_secret"
                permissions: {
                    publish:   { allow: [">"] }
                    subscribe: { allow: [">"] }
                }
            }
        ]
    }
}
system_account: SYS

# Logging
debug: false
trace: false
logtime: true
