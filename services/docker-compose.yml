# =============================================================================
# MapexOS Application Services (Standalone)
# =============================================================================
#
# Pre-built images from Docker Hub. No build tools required.
# Included automatically by the root docker-compose.yml.
# Requires infrastructure from infra/docker-compose.yml.
#
# Services:
#   - mapex-iam        : Core platform service        (port 5000)
#   - http-gateway     : HTTP Gateway / API aggregator (port 5001)
#   - assets           : Asset management API          (port 5002)
#   - router           : Event routing                 (port 5003)
#   - events           : Event processing              (port 5004)
#   - triggers         : Trigger execution             (port 5006)
#   - workflow          : DAG workflow engine           (port 5007)
#   - mapex-vault       : Credential vault             (port 5010)
#   - lns              : LoRaWAN Network Server        (http 5011, udp 1700, ws 1887)
#   - js-executor      : Dynamic JS execution engine   (port 8000)
#   - js-wf-executor   : Workflow JS code node executor (port 8001)
#   - frontend         : Web UI (nginx)                (port 80)
#
# -----------------------------------------------------------------------------
# ATTENTION — frontend backend URLs
# -----------------------------------------------------------------------------
#
# The frontend container bakes each backend URL (mapex-iam, gateway,
# assets, router, events, triggers, workflow, vault, js-executor and
# the plugin CDN) into the JS bundle at boot. The browser then talks
# to those URLs directly — so `localhost` here means "localhost from
# the machine that opens the UI", NOT from the machine that runs
# docker compose.
#
#   * Running everything on your own dev machine and opening the UI
#     locally? The defaults work as-is.
#
#   * Running the stack on a VM, a server, or splitting services
#     across hosts? Edit each line in:
#
#         services/frontend/envs/frontend.env
#
#     to point at the actual host or IP per service. Each URL is
#     independent — you can mix and match (e.g. iam on a VM, plugin
#     CDN on a public Netlify, the rest on localhost). No image
#     rebuild needed: the frontend container reads the env vars and
#     rewrites the placeholders in the JS bundle on every container
#     start.
#
# =============================================================================

services:
  # ===========================================================================
  # MAPEX IAM SERVICE (port 5000)
  # ===========================================================================
  mapex-iam:
    image: thiagoanselmo/mapex-iam:1.0.0
    container_name: mapex-iam
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    ports:
      - "5000:5000"
    env_file:
      - ../infra/envs/local.env
      - ./mapexIam/envs/mapexIam.env
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats-core:
        condition: service_healthy
    networks:
      - mapex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # HTTP GATEWAY SERVICE (port 5001)
  # ===========================================================================
  http-gateway:
    image: thiagoanselmo/http-gateway:1.0.0
    container_name: mapex-http-gateway
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    ports:
      - "5001:5001"
    env_file:
      - ../infra/envs/local.env
      - ./http_gateway/envs/http_gateway.env
    depends_on:
      mapex-iam:
        condition: service_healthy
    networks:
      - mapex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # ASSETS SERVICE (port 5002)
  # ===========================================================================
  assets:
    image: thiagoanselmo/assets:1.0.0
    container_name: mapex-assets
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    ports:
      - "5002:5002"
    env_file:
      - ../infra/envs/local.env
      - ./assets/envs/assets.env
    depends_on:
      mapex-iam:
        condition: service_healthy
    networks:
      - mapex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # ROUTER SERVICE (port 5003)
  # ===========================================================================
  router:
    image: thiagoanselmo/router:1.0.0
    container_name: mapex-router
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    ports:
      - "5003:5003"
    env_file:
      - ../infra/envs/local.env
      - ./router/envs/router.env
    depends_on:
      mapex-iam:
        condition: service_healthy
    networks:
      - mapex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # EVENTS SERVICE (port 5004)
  # ===========================================================================
  events:
    image: thiagoanselmo/events:1.0.0
    container_name: mapex-events
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    ports:
      - "5004:5004"
    env_file:
      - ../infra/envs/local.env
      - ./events/envs/events.env
    depends_on:
      mapex-iam:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    networks:
      - mapex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5004/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # TRIGGERS SERVICE (port 5006)
  # ===========================================================================
  triggers:
    image: thiagoanselmo/triggers:1.0.0
    container_name: mapex-triggers
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    ports:
      - "5006:5006"
    env_file:
      - ../infra/envs/local.env
      - ./triggers/envs/triggers.env
    depends_on:
      mapex-iam:
        condition: service_healthy
    networks:
      - mapex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5006/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # WORKFLOW SERVICE (port 5007)
  # ===========================================================================
  workflow:
    image: thiagoanselmo/workflow:1.0.0
    container_name: mapex-workflow
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    ports:
      - "5007:5007"
    env_file:
      - ../infra/envs/local.env
      - ./workflow/envs/workflow.env
    depends_on:
      mapex-iam:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    networks:
      - mapex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5007/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # VAULT SERVICE (port 5010)
  # ===========================================================================
  mapex-vault:
    image: thiagoanselmo/mapex-vault:1.0.0
    container_name: mapex-vault
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    ports:
      - "5010:5010"
    env_file:
      - ../infra/envs/local.env
      - ./mapexVault/envs/mapexVault.env
    depends_on:
      mapex-iam:
        condition: service_healthy
    networks:
      - mapex-network
    restart: unless-stopped
    # PKI material is no longer bootstrapped from disk. The mongodb-init
    # container (infra compose) generates the CA pair and inserts encrypted
    # CA docs into mapex_vault.pkiCertificateAuthorities. mapexVault reads
    # from Mongo only.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5010/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # LORAWAN NETWORK SERVER (LNS)
  # /health HTTP 5011 | Semtech gateways UDP 1700 | Basics Station WebSocket 1887
  # Embeds The Things Stack (Gateway + Network + Join servers); cold config from
  # the Assets MS, hot session from Redis, device-keys KEK from mapexVault.
  # ===========================================================================
  lns:
    image: thiagoanselmo/lns:1.0.0
    container_name: mapex-lns
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    ports:
      - "5011:5011"
      - "1700:1700/udp"
      - "1887:1887"
    env_file:
      - ../infra/envs/local.env
      - ./lns/envs/lns.env
    depends_on:
      assets:
        condition: service_healthy
      mapex-vault:
        condition: service_healthy
    networks:
      - mapex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5011/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================================================
  # JS EXECUTOR SERVICE (port 8000)
  # ===========================================================================
  js-executor:
    image: thiagoanselmo/js-executor:1.0.0
    container_name: mapex-js-executor
    user: "root"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M
    ports:
      - "8000:8000"
    env_file:
      - ../infra/envs/local.env
      - ./js_executor/envs/js_executor.env
    depends_on:
      assets:
        condition: service_healthy
    networks:
      - mapex-network
    restart: unless-stopped

  # ===========================================================================
  # JS WORKFLOW EXECUTOR SERVICE (port 8001)
  # ===========================================================================
  js-wf-executor:
    image: thiagoanselmo/js-wf-executor:1.0.0
    container_name: mapex-js-wf-executor
    user: "root"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M
    ports:
      - "8001:8001"
    env_file:
      - ../infra/envs/local.env
      - ./js_workflow_executor/envs/js_workflow_executor.env
    depends_on:
      nats-core:
        condition: service_healthy
    networks:
      - mapex-network
    restart: unless-stopped

  # ===========================================================================
  # FRONTEND - Web UI (port 80)
  # ===========================================================================
  frontend:
    image: thiagoanselmo/frontend:1.0.0
    container_name: mapex-frontend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M
    ports:
      - "80:80"
    # Per-service URL overrides live in services/frontend/envs/frontend.env.
    # Defaults point at localhost; edit one line per backend you want
    # to retarget (see the file header for the full note).
    env_file:
      - ./frontend/envs/frontend.env
    depends_on:
      mapex-iam:
        condition: service_healthy
    networks:
      - mapex-network
    restart: unless-stopped
